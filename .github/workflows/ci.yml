name: lint CI CD Python

on:
  push:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Revisar calidad del codigo
        run: |
          flake8 app test --max-line-length=120

  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -v

  cd:
    runs-on: ubuntu-latest
    needs: [lint, ci]

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Crear carpeta de entrega
        run: |
          mkdir entrega
          cp -r app entrega/
          cp requirements.txt entrega/
          cp README.md entrega/ || true

      - name: Comprimir proyecto
        run: zip -r proyecto_python.zip entrega

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: proyecto-python
          path: proyecto_python.zip